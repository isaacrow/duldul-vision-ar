name: Build Native iOS IPA (Duldul Vision AR)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA with RealityKit & ARKit
    runs-on: macos-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build and Archive iOS App
        run: |
          cd ios-app/DuldulVisionAR
          mkdir -p build
          
          # Clean and build archive without code signing
          xcodebuild archive \
            -project DuldulVisionAR.xcodeproj \
            -scheme DuldulVisionAR \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DuldulVisionAR.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          cd ios-app/DuldulVisionAR/build
          mkdir -p Payload
          cp -r DuldulVisionAR.xcarchive/Products/Applications/DuldulVisionAR.app Payload/
          zip -r DuldulVisionAR-Release.ipa Payload
          ls -la DuldulVisionAR-Release.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuldulVisionAR-Release-IPA
          path: ios-app/DuldulVisionAR/build/DuldulVisionAR-Release.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios-app/DuldulVisionAR/build/DuldulVisionAR-Release.ipa
          name: "دلدل - الملاحة الحقيقية ${{ github.ref_name }}"
          body: |
            ### دلدل للرؤية والملاحة - الإصدار الحقيقي الكامل 🗺️🇮🇶
            - **الواجهة الافتتاحية خريطة حقيقية فوراً:** تم إلغاء شاشة تسلا ثلاثية الأبعاد التجريبية تماماً وجعل الخريطة هي الشاشة الأساسية الأولى.
            - **محرك ملاحة وتوجيه حقيقي (On-Device Apple MapKit + OSRM):** حساب المسارات والمنعطفات ورسم الخط التفاعلي كاملاً على الجهاز بدون الاعتماد على سيرفر خارجي مؤقت.
            - **توجيه صوتي باللهجة العراقية الأصيلة:** "لوف يمنة هسة"، "توكل على الله، انطلق إلى..."، رصد الانحراف عن المسار وإعادة التوجيه التلقائي.
            - **رادار الجسور الـ 12 في بغداد:** رصد حركة المرور والازدحام وسرعة العبور.
            - **كاميرات السرعة والسيطرات:** تنبيهات حقيقية مسبقة عند الاقتراب من الرادارات وسيطرات التفتيش.
            - **بحث فوري عن الأماكن في العراق:** مطاعم، مولات، مستشفيات، شوارع مع إكمال تلقائي فوري.
