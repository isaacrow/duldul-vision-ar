version: '3.8'

services:
  # Self-Hosted OpenStreetMap Routing Engine for Republic of Iraq
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: duldul-valhalla-iraq
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - tile_urls=https://download.geofabrik.de/asia/iraq-latest.osm.pbf
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - build_elevation=True
      - build_admins=True
      - build_time_zones=True
    volumes:
      - ./valhalla_tiles:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-Hosted Photon Geocoder (OSM-based Geocoding & Address Autocomplete)
  photon:
    image: ringofstorms/photon:latest
    container_name: duldul-photon-iraq
    restart: unless-stopped
    ports:
      - "2322:2322"
    environment:
      - AUTOMATIC_UPDATES=true
    volumes:
      - ./photon_data:/photon/photon_data

  # Node.js Core Backend (Community Incidents, Telemetry, AR Catalog, Bridges)
  duldul-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: duldul-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VALHALLA_BACKEND_URL=http://valhalla:8002
      - PHOTON_BACKEND_URL=http://photon:2322
    depends_on:
      - valhalla
      - photon

  # Caddy Reverse Proxy for Automatic Let's Encrypt SSL
  caddy:
    image: caddy:2-alpine
    container_name: duldul-caddy-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - duldul-api
