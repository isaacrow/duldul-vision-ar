version: '3.8'

# 🇮🇶 مسار العراق (Masar Iraq) — 100% Free & Self-Hosted Infrastructure
# Zero Paid APIs • Zero Tokens • Zero Monthly Bills

services:
  masar-app:
    image: node:20-alpine
    container_name: masar-iraq-app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - OSRM_BACKEND_URL=http://osrm-iraq:5000
    command: sh -c "npm install && node server.js"
    depends_on:
      - osrm-iraq
    restart: unless-stopped

  # Self-Hosted OpenStreetMap OSRM Iraq Engine ($0 Cost Forever)
  osrm-iraq:
    image: osrm/osrm-backend:latest
    container_name: masar-iraq-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/iraq-latest.osrm
    restart: unless-stopped
